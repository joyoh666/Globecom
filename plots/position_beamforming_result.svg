<text x="110.0" y="506.00" text-anchor="end" class="axis">-50.0</text>
<line x1="120.0" y1="431.20" x2="577.0" y2="431.20" stroke="#e5e9f0" stroke-width="1"/>
<text x="110.0" y="435.20" text-anchor="end" class="axis">-48.8</text>
<line x1="120.0" y1="360.40" x2="577.0" y2="360.40" stroke="#e5e9f0" stroke-width="1"/>
<text x="110.0" y="364.40" text-anchor="end" class="axis">-47.6</text>
<line x1="120.0" y1="289.60" x2="577.0" y2="289.60" stroke="#e5e9f0" stroke-width="1"/>
<text x="110.0" y="293.60" text-anchor="end" class="axis">-46.4</text>
<line x1="120.0" y1="218.80" x2="577.0" y2="218.80" stroke="#e5e9f0" stroke-width="1"/>
