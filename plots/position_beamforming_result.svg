<rect x="257.50" y="548.00" width="12" height="12" fill="#f28e2b"/>
<text x="275.50" y="558.00" class="legend">Codebook oracle</text>
<rect x="387.50" y="548.00" width="12" height="12" fill="#59a14f"/>
<text x="405.50" y="558.00" class="legend">Full-CSI MRT</text>
<rect x="620" y="90" width="530" height="490" rx="12" fill="#ffffff" stroke="#d8dee9"/>
<text x="640" y="121" class="panel-title">Single-antenna UE: over-the-air coherent sum</text>
<line x1="690.0" y1="502.00" x2="1132.0" y2="502.00" stroke="#e5e9f0" stroke-width="1"/>
<text x="680.0" y="506.00" text-anchor="end" class="axis">-50.0</text>
<line x1="690.0" y1="431.20" x2="1132.0" y2="431.20" stroke="#e5e9f0" stroke-width="1"/>
