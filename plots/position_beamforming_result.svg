<text x="348.50" y="527.00" text-anchor="middle" class="axis-label">RU 2</text>
<rect x="447.99" y="332.49" width="32.56" height="169.51" fill="#4c78a8"/>
<text x="464.27" y="325.49" text-anchor="middle" class="value">-47.13</text>
<rect x="484.55" y="332.49" width="32.56" height="169.51" fill="#f28e2b"/>
<rect x="521.11" y="329.74" width="32.56" height="172.26" fill="#59a14f"/>
