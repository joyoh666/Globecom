<line x1="120.0" y1="148.00" x2="577.0" y2="148.00" stroke="#e5e9f0" stroke-width="1"/>
<text x="110.0" y="152.00" text-anchor="end" class="axis">-44.0</text>
<text x="67" y="325.00" text-anchor="middle" transform="rotate(-90 67 325.00)" class="axis-title">Gain [dB]</text>
<rect x="143.33" y="236.24" width="32.56" height="265.76" fill="#4c78a8"/>
<text x="159.61" y="229.24" text-anchor="middle" class="value">-45.50</text>
<rect x="179.89" y="236.24" width="32.56" height="265.76" fill="#f28e2b"/>
<rect x="216.45" y="218.03" width="32.56" height="283.97" fill="#59a14f"/>
<text x="232.73" y="211.03" text-anchor="middle" class="value">-45.19</text>
