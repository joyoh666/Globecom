<text x="637" y="325.00" text-anchor="middle" transform="rotate(-90 637 325.00)" class="axis-title">Gain [dB]</text>
<rect x="713.20" y="342.54" width="42.00" height="159.46" fill="#4c78a8"/>
<text x="734.20" y="335.54" text-anchor="middle" class="value">-45.50</text>
<text x="734.20" y="527.00" text-anchor="middle" class="axis-label">Best RU</text>
<rect x="801.60" y="445.61" width="42.00" height="56.39" fill="#4c78a8"/>
<text x="822.60" y="438.61" text-anchor="middle" class="value">-48.41</text>
<text x="822.60" y="527.00" text-anchor="middle" class="axis-label">Direct DFT</text>
<rect x="890.00" y="203.24" width="42.00" height="298.76" fill="#4c78a8"/>
<text x="911.00" y="196.24" text-anchor="middle" class="value">-41.56</text>
<text x="911.00" y="527.00" text-anchor="middle" class="axis-label">Pred.-CSI</text>
<rect x="978.40" y="203.24" width="42.00" height="298.76" fill="#4c78a8"/>
<text x="999.40" y="196.24" text-anchor="middle" class="value">-41.56</text>
<text x="999.40" y="527.00" text-anchor="middle" class="axis-label">Perfect phase</text>
<rect x="1066.80" y="194.98" width="42.00" height="307.02" fill="#4c78a8"/>
<text x="1087.80" y="187.98" text-anchor="middle" class="value">-41.33</text>
<text x="1087.80" y="527.00" text-anchor="middle" class="axis-label">Global MRT</text>
<rect x="830.50" y="548.00" width="12" height="12" fill="#4c78a8"/>
<text x="848.50" y="558.00" class="legend">Channel gain</text>
<text x="60" y="626" class="metric">Predicted CSI vs direct: <tspan font-weight="600">+6.85 dB</tspan></text>
<text x="410" y="626" class="metric">Prediction loss vs perfect phase: <tspan font-weight="600">+0.00 dB</tspan></text>
<text x="800" y="626" class="metric">Predicted-CSI power vs MRT: <tspan font-weight="600">94.77%</tspan></text>
<text x="60" y="663" class="subtitle">One predicted common phase is applied per RU; the UE still has one antenna and performs no receive combining.</text>
</svg>