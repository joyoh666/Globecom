<line x1="690.0" y1="360.40" x2="1132.0" y2="360.40" stroke="#e5e9f0" stroke-width="1"/>
<text x="680.0" y="364.40" text-anchor="end" class="axis">-46.0</text>
<line x1="690.0" y1="289.60" x2="1132.0" y2="289.60" stroke="#e5e9f0" stroke-width="1"/>
<text x="680.0" y="293.60" text-anchor="end" class="axis">-44.0</text>
<line x1="690.0" y1="218.80" x2="1132.0" y2="218.80" stroke="#e5e9f0" stroke-width="1"/>
<text x="680.0" y="222.80" text-anchor="end" class="axis">-42.0</text>
<line x1="690.0" y1="148.00" x2="1132.0" y2="148.00" stroke="#e5e9f0" stroke-width="1"/>
